llm:
  activeProvider: aws-claude
  providers:
    gpt4o:
      type: openai
      model: gpt-4o
      temperature: 0.7
      maxTokens: 2000
    
    staging-claude:
      type: anthropic
      model: claude-2
      maxTokensToSample: 1000
    
    aws-claude:
      type: bedrock
      model: anthropic.claude-v2
      region: us-east-1

      